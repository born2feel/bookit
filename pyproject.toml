[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bookit"
version = "0.1.0"
description = "Telegram bot for booking appointments with an admin panel"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0,<4",
    "sqlalchemy[asyncio]>=2.1.5,<2.2",
    "alembic>=1.20,<2",
    "pydantic-settings>=2.16,<3",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.32.0",
    "tzdata>=2026.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# UI strings intentionally use typographic symbols (➕, –, —)
"src/bookit/bot/i18n/*.py" = ["RUF001"]
"src/bookit/bot/texts.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["bookit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
